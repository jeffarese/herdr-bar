id = "herdr-bar"
name = "Bar"
version = "0.7.3"
# Requires startup hooks and agent session metadata from Herdr 0.9.
min_herdr_version = "0.9.0"
description = "Cmd+K command bar with agent icons, fuzzy search, and optional automatic tab titles"
platforms = ["linux", "macos", "windows"]

# Opening the bar is a one-liner through the Herdr CLI. Herdr runs manifest
# commands without a shell, Windows has no `sh`, and Herdr rejects a second
# `open` action even with a different `platforms` list, so the one-liner lives
# in src/herdr_bar/opener.py and costs one interpreter startup. It prefers
# HERDR_BIN_PATH and falls back to whatever `herdr` is on PATH when that binary
# has been upgraded away under a running server. On Windows, `python3` must
# start Python 3.9+; the Microsoft Store build of Python provides it.
[[actions]]
id = "open"
title = "Open bar"
description = "Fuzzy-jump to any tab, pane, or agent"
contexts = ["global"]
command = ["python3", "run.py", "--open"]

[[panes]]
id = "bar"
title = "Bar"
description = "Fuzzy-jump to any tab, pane, or agent"
placement = "popup"
width = "74%"
height = "62%"
command = ["python3", "run.py"]

[[startup]]
command = ["python3", "run.py", "--start-titles"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "run.py", "--start-titles"]

[[actions]]
id = "start-titles"
title = "Start tab watcher"
description = "Start task title and tab status updates enabled in the plugin config"
contexts = ["global"]
command = ["python3", "run.py", "--start-titles", "--resume"]

[[actions]]
id = "stop-titles"
title = "Stop tab watcher"
description = "Stop this server's title and status watcher, restoring bare tab names"
contexts = ["global"]
command = ["python3", "run.py", "--stop-titles"]
